[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diema-challenge"
version = "0.1.0"
description = "MMAC@ACII 2026 DIEM-A Challenge: 12-class emotion recognition from motion capture"
requires-python = ">=3.10"
dependencies = [
    # Deep Learning
    "torch>=2.0",
    "pytorch-lightning>=2.0",
    "torchmetrics>=0.11",
    # Motion capture
    "pybvh>=0.4",
    "pybvh-ml>=0.2",
    # Experiment management
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb",
    # Data
    "numpy>=1.21",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    # Visualization
    "matplotlib>=3.7",
    "seaborn",
    "tensorboard>=2.14",
    # Utilities
    "pyyaml>=6.0",
    "click>=8.0",
    "tqdm",
    "rich",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest>=7.0",
    "pytest-cov",
    "ipykernel",
    "jupyterlab",
]
# mocap toolchain for (Gemini rationale) / 3AF (C3D stats).
# Lower+upper version pins to guard reproducibility against breaking changes.
# aitviewer requires OpenGL/EGL; set EGL_PLATFORM=surfaceless on headless servers.
mocap = [
    "ezc3d>=1.5.10,<2.0",
    "aitviewer>=1.13.0,<2.0",
    "google-generativeai>=0.8.0,<1.0",
    "fasttext-langdetect>=1.0.5,<2.0",
]

[tool.setuptools.packages.find]
include = ["diema*", "utils*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["diema", "utils", "experiments", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
