# exp036: Content/Style Dual-Head
#
# Wraps the Region-Aware Conv1D+Tr backbone with a DualHead_Model
# that projects backbone features into z_content and z_style, then trains
# with emotion + performer-style + weak adversarial + orthogonality losses.
#
# intent:
#   - CE on (z_content -> emotion) is the primary task
#   - CE on (z_style -> performer) keeps style info alive in z_style
#   - Weak GRL + CE on (z_content -> performer) pushes performer identity
#     OUT of z_content (but only weakly — λ=0.05 by default)
#   - Orthogonality penalty (β=0.01) keeps z_content and z_style
#     linearly decorrelated

defaults:
  - _self_
  - exp: "a00"

debug: false
seed: 42
fold: 0
num_folds: 10
exp_tag: "a00"

# data
data_path: ""
train_csv_path: "data/diema_challenge/raw/train_data.csv"
target_repr: "6d"
clip_length: 64
num_workers: 8

# backbone (Region-Aware Conv1D+Tr, reusing exp034 defaults)
model_name: "region_aware_conv1d_transformer"
num_class: 12
in_channels: 6
dim: 160
num_conv_blocks: 3
kernel_size: 7
num_cross_blocks: 2
num_heads: 4
mlp_ratio: 2.0
drop_rate: 0.3
late_dropout: 0.8
late_dropout_start_step: 1000
use_per_part_gate: true
num_nodes: 25

# dual-head
content_dim: 256
style_dim: 256
proj_dropout: 0.1
grl_lambda: 0.05
loss_weight_style: 1.0
loss_weight_adv: 1.0
loss_weight_ortho: 0.01

# training
batch_size: 128
max_epochs: 80
optimizer: "AdamW"
lr: 4.0e-3
weight_decay: 5.0e-4
scheduler_type: "cosine_warmup"
warmup_epochs: 5
early_stopping_patience: 15
loss_type: "ce"
label_smoothing: 0.3

# augmentation (same as exp034 baseline, aug disabled)
augment_rotate: true
augment_mirror: true
augment_speed: true
augment_noise_sigma: 2.5
