# exp040: Performer-Aware SupCon on Content
# Backbone: Conv1D+Transformer (exp020 a01 best settings)
# Loss: CE + λ·SupCon (performer-aware weighting)

defaults:
  - _self_
  - exp: "a00"

debug: false
seed: 42
fold: 0
num_folds: 10
exp_tag: "a00"

# data
data_path: ""
target_repr: "6d"
clip_length: 64
num_workers: 8

# backbone (matches exp020 a01 best settings)
model_name: "conv1d_transformer"
num_class: 12
in_channels: 6
dim: 192
num_blocks: 2
kernel_size: 17
num_heads: 4
mlp_ratio: 2.0
drop_rate: 0.3
late_dropout: 0.8
late_dropout_start_step: 1000
pool_type: "gap"

# SupCon head
proj_dim: 128

# skeleton
num_nodes: 25

# training
batch_size: 128
max_epochs: 80
optimizer: "AdamW"
lr: 4.0e-3
weight_decay: 5.0e-4
scheduler_type: "cosine_warmup"
warmup_epochs: 5
early_stopping_patience: 15
loss_type: "ce"
label_smoothing: 0.3

# SupCon loss (a00)
supcon_lambda: 0.05
supcon_warmup_epochs: 5
supcon_temperature: 0.1
supcon_w_strong: 2.0
supcon_w_weak: 0.5

# CenterLoss (a01, SupCon replacement)
use_center_loss: false
lambda_center: 0.001
lambda_tau: 20.0
center_lr: 0.5

# augmentation
augment_rotate: true
augment_mirror: true
augment_speed: true
augment_noise_sigma: 2.5

# aug (opt-in, off by default)
seq_cutout_p: 0.0
seq_cutout_segments: 5
seq_cutout_ratio: 0.15
body_scale_jitter_lo: 0.0
body_scale_jitter_hi: 0.0
mixup_alpha: 0.0
cutmix_alpha: 0.0
