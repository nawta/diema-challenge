# exp042: Style-Conditioned MoE Head
# Backbone: Conv1D+Transformer (exp020 a01 settings)
# Head: Residual MoE with style-based routing

defaults:
  - _self_
  - exp: "a00"

debug: false
seed: 42
fold: 0
num_folds: 10
exp_tag: "a00"

# data
data_path: ""
target_repr: "6d"
clip_length: 64
num_workers: 8

# backbone
model_name: "conv1d_transformer"
num_class: 12
in_channels: 6
dim: 192
num_blocks: 2
kernel_size: 17
num_heads: 4
mlp_ratio: 2.0
drop_rate: 0.3
late_dropout: 0.8
late_dropout_start_step: 1000
pool_type: "gap"

# MoE head (v2: feature adapter)
num_experts: 2
adapter_bottleneck: 64
expert_hidden: 192
router_hidden: 64
alpha_init: 0.0
use_style_concat: false

# skeleton
num_nodes: 25

# training
batch_size: 128
max_epochs: 80
optimizer: "AdamW"
lr: 4.0e-3
weight_decay: 5.0e-4
scheduler_type: "cosine_warmup"
warmup_epochs: 5
early_stopping_patience: 15
loss_type: "ce"
label_smoothing: 0.3

# MoE regularization
lambda_lb: 0.01
lambda_ent: 0.01
lambda_div: 0.005

# augmentation
augment_rotate: true
augment_mirror: true
augment_speed: true
augment_noise_sigma: 2.5

# (off by default)
seq_cutout_p: 0.0
seq_cutout_segments: 5
seq_cutout_ratio: 0.15
body_scale_jitter_lo: 0.0
body_scale_jitter_hi: 0.0
mixup_alpha: 0.0
cutmix_alpha: 0.0
