# exp022: Shallow 5-layer Conformer (bliao port)
defaults:
  - _self_
  - exp: "a00"

debug: false
seed: 42
fold: 0
num_folds: 10
exp_tag: "a00"

data_path: ""
target_repr: "6d"
clip_length: 64
num_workers: 8

model_name: "conformer"
num_class: 12
in_channels: 6
num_layers: 5
hidden_dim: 384
mlp_dim: 1024
num_heads: 6
conv_kernel_size: 15
dropout: 0.1
attn_dropout: 0.0
drop_path: 0.1
max_seq_len: 256

num_nodes: 25

batch_size: 128
max_epochs: 100
optimizer: "AdamW"
lr: 5.0e-4
weight_decay: 1.0e-3
scheduler_type: "cosine_warmup"
warmup_epochs: 5
early_stopping_patience: 15
loss_type: "ce"
label_smoothing: 0.1

augment_rotate: true
augment_mirror: true
augment_speed: true
augment_noise_sigma: 2.5
