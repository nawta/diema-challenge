# exp052: GAP-style part-wise rationale local supervision
#
# Backbone: Region-Aware Conv1D+Transformer (exp034 a00 settings).
# Addition: PartAlignConv1DTr_Model head (6 × 384 projection) + CE
#           + λ_part · PartAlignmentLoss(cosine) on Qwen3-VL rationale embeddings.
#
# Go criterion (TODO 3AE-6): backbone (exp034 a00) vs exp052 a00 → +0.3pt F1
# on 3-fold mean. Pass → 10-fold completion + ensemble contribution.
#
# Prerequisites:
# 1. sweep complete (rationales for every train clip).
#   2. python tools/build_rationale_text_cache.py has been run, producing
#      output/rationale_text_cache.pt.
#
# Default settings (a00):
#   - backbone: region_aware_conv1d_transformer, dim=160 / 3 conv blocks / k=7
#   - rationale cache: output/rationale_text_cache.pt (Qwen3-VL prompt v1.0)
#   - part_loss_weight=0.05, mode=cosine (exp052 a00 conservative default)
#
# Related:
# - diema/models/conv1d_transformer/partalign_conv1d_tr_model.py
# - diema/training/part_align_trainer.py
# - diema/features/rationale_text_cache.py

defaults:
  - _self_
  - exp: "a00"

debug: false
seed: 42
fold: 0
num_folds: 10
exp_tag: "a00"

# data
data_path: ""
target_repr: "6d"
clip_length: 64
num_workers: 8

# backbone (exp034 a00 region-aware)
model_name: "region_aware_conv1d_transformer"
num_class: 12
in_channels: 6
dim: 160
num_conv_blocks: 3
kernel_size: 7
num_cross_blocks: 2
num_heads: 4
mlp_ratio: 2.0
drop_rate: 0.3
late_dropout: 0.8
late_dropout_start_step: 1000
use_per_part_gate: true

# Part alignment head (v4: mpnet-base-v2 768-d encoder)
text_dim: 768
num_parts: 6
proj_hidden: null   # default = backbone.feature_dim
rationale_cache_path: "output/rationale_text_cache_mpnet.pt"

# skeleton
num_nodes: 25

# training
batch_size: 128
max_epochs: 80
optimizer: "AdamW"
lr: 4.0e-3
weight_decay: 5.0e-4
scheduler_type: "cosine_warmup"
warmup_epochs: 5
early_stopping_patience: 15
loss_type: "ce"
label_smoothing: 0.3

# part loss (a00 conservative)
part_loss_weight: 0.05
part_loss_warmup_epochs: 0
part_loss_temperature: 0.1
part_loss_mode: "cosine"   # "cosine" (default) or "infonce"

# augmentation (mirror exp034 a00)
augment_rotate: true
augment_mirror: true
augment_speed: true
augment_noise_sigma: 2.5

# augmentations (off by default in a00)
seq_cutout_p: 0.0
seq_cutout_segments: 5
seq_cutout_ratio: 0.15
body_scale_jitter_lo: 0.0
body_scale_jitter_hi: 0.0
mixup_alpha: 0.0
cutmix_alpha: 0.0
