# exp065: scenario 8-attribute auxiliary head
#
# Backbone: exp034 a00 (Region-Aware Conv1D + Transformer)
# Aux head: 8 × Linear(feat_dim=960, 3) on the pooled features.
# Targets:  output/scenario_attrs_rule.json (rule-based 8-attr extraction)
# Loss:     L = CE(logits, label) + λ_attr * (1/8) * Σ CE(attr_logits[k], attr_target[k])
#
# 8-attr probe baseline (paper-grade signal density check):
#   - raw scenario mpnet probe: 53.09% F1 (3-fold LPO)
#   - 8-attr rule probe: 20.29% F1 → above the 14% gate, well below the
#     53% raw upper bound (compression loss). The aux head distills
#     signal from the rule-based attrs into the motion backbone.
#
# Defaults mirror exp034 a00 baseline (30.30% mean F1) except for the
# new λ_attr hyperparameter.

defaults:
  - _self_
  - exp: "a00"

debug: false
seed: 42
fold: 0
num_folds: 10
exp_tag: "a00"

# data
data_path: ""
target_repr: "6d"
clip_length: 64
num_workers: 8

# model (mirrors exp034 a00)
model_name: "region_aware_conv1d_transformer"
num_class: 12
in_channels: 6
dim: 160
num_conv_blocks: 3
kernel_size: 7
num_cross_blocks: 2
num_heads: 4
mlp_ratio: 2.0
drop_rate: 0.3
late_dropout: 0.8
late_dropout_start_step: 1000
use_per_part_gate: true

# skeleton
num_nodes: 25

# training
batch_size: 128
max_epochs: 80
optimizer: "AdamW"
lr: 4.0e-3
weight_decay: 5.0e-4
scheduler_type: "cosine_warmup"
warmup_epochs: 5
early_stopping_patience: 15
loss_type: "ce"
label_smoothing: 0.3

# augmentation (same as exp034 / exp020 baseline)
augment_rotate: true
augment_mirror: true
augment_speed: true
augment_noise_sigma: 2.5

# add-ons (off in baseline)
seq_cutout_p: 0.0
seq_cutout_segments: 5
seq_cutout_ratio: 0.15
body_scale_jitter_lo: 0.0
body_scale_jitter_hi: 0.0
mixup_alpha: 0.0
cutmix_alpha: 0.0

# exp065-specific knobs
attr_target_path: "output/scenario_attrs_rule.json"
lambda_attr: 0.10  # overridden by exp/{a00,a01,a02}.yaml
