# exp004: SkateFormer baseline
defaults:
  - _self_
  - exp: "a00"

debug: false
seed: 42
fold: 0
num_folds: 10
exp_tag: "a00"

data_path: ""
target_repr: "6d"
clip_length: 64
num_workers: 8

model_name: "skateformer"
num_class: 12
in_channels: 6
dim: 128
depth: 6
num_heads: 8
mlp_ratio: 4.0
window_size: 16
dropout: 0.3
attn_drop: 0.0
proj_drop: 0.0
drop_path: 0.1
pool_type: "gap"
use_arcface_head: false

num_nodes: 25

batch_size: 128
max_epochs: 65
optimizer: "SGD"
lr: 0.2
weight_decay: 5.0e-4
scheduler_type: "cosine"
warmup_epochs: 0
early_stopping_patience: 10
loss_type: "ce"
label_smoothing: 0.1

augment_rotate: true
augment_mirror: true
augment_speed: true
augment_noise_sigma: 2.5
