# exp060: VLM 12-class soft-label knowledge distillation (Tier 2)
#
# Backbone: Region-Aware Conv1D+Tr (exp034 a00) — exact same as the
#           production model. The only addition is the KD loss term.
# Loss:     CE(logits, y) + λ_kd · T² · KL(softmax(logits/T) || softmax(teacher/T))
#
# Why this exists: exp052 NO-GO (Δ=-0.64pt, F1) +
# linear probe (rationale text 12-class F1 = 10.94%) confirmed the rationale
# *text* lacks discriminative emotion signal. exp060 bypasses the text
# bottleneck — the VLM directly emits 12-class probabilities and we
# distill into the backbone classifier.
#
# Go criterion: backbone (exp034 a00, 30.30% ± 3.23%) vs exp060 a00 →
# +0.3pt F1 on 3-fold mean. Pass → 10-fold completion + ensemble merge.
#
# Prerequisites:
# 1. sweep complete (mp4 renders).
#   2. tools/generate_emotion_softlabel_qwenvl_vllm.py has produced
#      output/vlm_softlabel_train.npz.
#
# Related:
# - configs/prompts/emotion_softlabel_qwenvl_v1.0.yaml
# - tools/generate_emotion_softlabel_qwenvl_vllm.py
# - diema/training/kd_trainer.py
# - docs/rule_and_ethics_checklist.md §3.3

defaults:
  - _self_
  - exp: "a00"

debug: false
seed: 42
fold: 0
num_folds: 10
exp_tag: "a00"

# data
data_path: ""
target_repr: "6d"
clip_length: 64
num_workers: 8

# backbone (exp034 a00 region-aware)
model_name: "region_aware_conv1d_transformer"
num_class: 12
in_channels: 6
dim: 160
num_conv_blocks: 3
kernel_size: 7
num_cross_blocks: 2
num_heads: 4
mlp_ratio: 2.0
drop_rate: 0.3
late_dropout: 0.8
late_dropout_start_step: 1000
use_per_part_gate: true

# Soft-label KD
softlabel_path: "output/vlm_softlabel_train.npz"
kd_loss_weight: 0.5
kd_temperature: 2.0
kd_warmup_epochs: 0

# skeleton
num_nodes: 25

# training (exp034 a00 spec)
batch_size: 128
max_epochs: 80
optimizer: "AdamW"
lr: 4.0e-3
weight_decay: 5.0e-4
scheduler_type: "cosine_warmup"
warmup_epochs: 5
early_stopping_patience: 15
loss_type: "ce"
label_smoothing: 0.3

# augmentation
augment_rotate: true
augment_mirror: true
augment_speed: true
augment_noise_sigma: 2.5

# aug (off in a00)
seq_cutout_p: 0.0
seq_cutout_segments: 5
seq_cutout_ratio: 0.15
body_scale_jitter_lo: 0.0
body_scale_jitter_hi: 0.0
mixup_alpha: 0.0
cutmix_alpha: 0.0
