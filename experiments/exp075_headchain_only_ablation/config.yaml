# exp075: head-chain-only ablation — joint-masked Conv1D+Transformer
# . Tiny dim=128 / 2 blocks (~0.4M params) with `keep_joints`
# overridable per variant in exp/{a00..a03}.yaml.

defaults:
  - _self_
  - exp: "a00_top4"

debug: false
seed: 42
fold: 0
num_folds: 10
exp_tag: "a00"

# data
data_path: ""
target_repr: "6d"
clip_length: 64
num_workers: 8

# model
model_name: "joint_masked_conv1d_transformer"
num_class: 12
in_channels: 6
dim: 128
num_blocks: 2
kernel_size: 17
num_heads: 4
mlp_ratio: 2.0
drop_rate: 0.3
late_dropout: 0.8
late_dropout_start_step: 1000
pool_type: "gap"
# Which CTV joint indices to keep (others zero-masked). Override per variant.
keep_joints: [5, 6, 7, 8]  # default: top-4 (Spine3, Neck, Neck1, Head)

# skeleton
num_nodes: 25

# training
batch_size: 128
max_epochs: 40
optimizer: "AdamW"
lr: 4.0e-3
weight_decay: 5.0e-4
scheduler_type: "cosine_warmup"
warmup_epochs: 5
early_stopping_patience: 15
loss_type: "ce"
label_smoothing: 0.3

# augmentation (same as exp020 / exp003 baseline)
augment_rotate: true
augment_mirror: true
augment_speed: true
augment_noise_sigma: 2.5

# domain generalization package (off by default)
seq_cutout_p: 0.0
seq_cutout_segments: 5
seq_cutout_ratio: 0.15
body_scale_jitter_lo: 0.0
body_scale_jitter_hi: 0.0
mixup_alpha: 0.0
cutmix_alpha: 0.0
