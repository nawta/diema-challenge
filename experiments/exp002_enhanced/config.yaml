# exp002: Enhanced STGCN++ with longer clips and label smoothing
# Base improvements over exp001: clip_length=128, label_smoothing=0.1, multi-clip test

defaults:
  - _self_
  - exp: "a00"

debug: false
seed: 42
fold: 0
num_folds: 10

# data
data_path: ""
target_repr: "6d"
clip_length: 128
num_workers: 8

# model
model_name: "stgcn"
num_class: 12
in_channels: 6
dropout: 0.5
edge_weighting: true
plusplus: true
unit_dropout: 0.15

# skeleton
num_nodes: 25

# training
batch_size: 256
max_epochs: 100
optimizer: "SGD"
lr: 0.2
weight_decay: 5.0e-4
scheduler_type: "cosine"
early_stopping_patience: 15
loss_type: "ce"
label_smoothing: 0.1

# test-time
test_clips: 10

# experiment tag
exp_tag: "a00"

# augmentation
augment_rotate: true
augment_mirror: true
augment_speed: true
augment_noise_sigma: 2.5
