# exp034: Region-Aware Conv1D + Transformer
#
# Part-aware extension of exp020 a01 (Conv1D+Tr, current single best at 29.87% F1).
# 6 body-part branches (torso / head / r_arm / l_arm / r_leg / l_leg), SGN-style
# joint/frame id embeddings, cross-part transformer, per-part gating.
#
# Default training settings mirror exp020 a01: AdamW lr=4e-3, cosine_warmup
# (warmup 5 / 80 epochs), clip=64, batch=128, label_smoothing=0.3, drop_rate=0.3.

defaults:
  - _self_
  - exp: "a00"

debug: false
seed: 42
fold: 0
num_folds: 10
exp_tag: "a00"

# data
data_path: ""
target_repr: "6d"
clip_length: 64
num_workers: 8

# model
model_name: "region_aware_conv1d_transformer"
num_class: 12
in_channels: 6
dim: 160
num_conv_blocks: 3
kernel_size: 7
num_cross_blocks: 2
num_heads: 4
mlp_ratio: 2.0
drop_rate: 0.3
late_dropout: 0.8
late_dropout_start_step: 1000
use_per_part_gate: true

# skeleton
num_nodes: 25

# training
batch_size: 128
max_epochs: 80
optimizer: "AdamW"
lr: 4.0e-3
weight_decay: 5.0e-4
scheduler_type: "cosine_warmup"
warmup_epochs: 5
early_stopping_patience: 15
loss_type: "ce"
label_smoothing: 0.3

# augmentation (same as exp020 / exp003 baseline)
augment_rotate: true
augment_mirror: true
augment_speed: true
augment_noise_sigma: 2.5

# domain generalization package (opt-in; off by default in a00)
seq_cutout_p: 0.0
seq_cutout_segments: 5
seq_cutout_ratio: 0.15
body_scale_jitter_lo: 0.0
body_scale_jitter_hi: 0.0
mixup_alpha: 0.0
cutmix_alpha: 0.0

# v2 add-on: CenterLoss probe (Codex Option B, secondary hedge)
use_center_loss: false
lambda_center: 0.001
lambda_tau: 20.0
center_lr: 0.5
