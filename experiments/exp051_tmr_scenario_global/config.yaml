# exp051: TMR-style scenario global text alignment
#
# Backbone: Conv1D+Transformer (exp020 a01 settings, dim=192 / 2 blocks / k=17)
# Addition: TextAlignConv1DTr_Model projection head (384-d) + GlobalInfoNCE on
# masked scenario embeddings. positive_pairing=same_scenario_and_emotion.
#
# Go criterion (TODO 3AE-5): backbone vs exp051 a00 → +0.3pt F1 (3-fold mean).
#
# Related: diema/models/conv1d_transformer/textalign_conv1d_tr_model.py
#          diema/training/text_align_trainer.py
#          diema/features/text_cache.py

defaults:
  - _self_
  - exp: "a00"

debug: false
seed: 42
fold: 0
num_folds: 10
exp_tag: "a00"

# data
data_path: ""
target_repr: "6d"
clip_length: 64
num_workers: 8

# backbone (exp020 a01 best)
model_name: "conv1d_transformer"
num_class: 12
in_channels: 6
dim: 192
num_blocks: 2
kernel_size: 17
num_heads: 4
mlp_ratio: 2.0
drop_rate: 0.3
late_dropout: 0.8
late_dropout_start_step: 1000
pool_type: "gap"

# Text alignment head
text_dim: 384
proj_hidden: null  # default = feature_dim
text_cache_path: "output/scenario_text_cache_masked.pt" # masked default
train_csv_path: "data/diema_challenge/raw/train_data.csv"

# skeleton
num_nodes: 25

# training
batch_size: 128
max_epochs: 80
optimizer: "AdamW"
lr: 4.0e-3
weight_decay: 5.0e-4
scheduler_type: "cosine_warmup"
warmup_epochs: 5
early_stopping_patience: 15
loss_type: "ce"
label_smoothing: 0.3

# text loss (a00 default)
text_loss_weight: 0.1
text_loss_warmup_epochs: 0
text_loss_temperature: 0.1
text_loss_symmetric: true
positive_pairing: "same_scenario_and_emotion"

# augmentation (mirror exp020 a01 / exp040 a00)
augment_rotate: true
augment_mirror: true
augment_speed: true
augment_noise_sigma: 2.5

# augmentations (opt-in)
seq_cutout_p: 0.0
seq_cutout_segments: 5
seq_cutout_ratio: 0.15
body_scale_jitter_lo: 0.0
body_scale_jitter_hi: 0.0
mixup_alpha: 0.0
cutmix_alpha: 0.0
